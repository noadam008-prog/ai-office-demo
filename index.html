<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AIバーチャルオフィス 委員会運営版</title>
<style>
/* 画面の色・幅・余白は、ここの変数にまとめる。字は 11px より小さくしない。 */
:root {
  --ink: #22262e; --sub: #6b7280; --line: #e3e0d8; --paper: #ffffff; --bg: #ece8e0; --accent: #e0484f; --ok: #2e9f5b; --ng: #e0484f; --guest: #1f9d8a; --blue: #2f7fc1;
  --m: 14px; --left-w: clamp(320px, 25vw, 400px); --left-h: clamp(300px, 40vh, 420px); --right-w: 320px; --r: 14px;
  --font: "Yu Gothic UI", "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.55 var(--font); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; opacity: .5; }
[hidden] { display: none !important; }
#stage { position: fixed; inset: 0; }
#gl { width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
#no3d { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); background: var(--paper); padding: 14px 20px; border-radius: var(--r); font-size: 14px; }

/* 名札と、頭の上の文 */
.icon { --c: #888; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon.mini { width: 20px; height: 20px; font-size: 11px; }
.plate { position: absolute; left: 0; top: 0; height: 38px; padding: 0 7px; display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 20px; border: 1px solid var(--line); white-space: nowrap; }
.plate .ring { padding: 0; border-radius: 50%; border: 2px solid #c9ccd3; display: inline-flex; flex: none; }
.plate .ptxt { display: flex; flex-direction: column; line-height: 1.2; }
.plate b { font-size: 14px; } .plate small { font-size: 11px; color: var(--sub); }
.plate[data-status="working"] .ring { border-color: var(--blue); border-top-color: transparent; animation: spin 1s linear infinite; }
.plate[data-status="working"] .icon { animation: unspin 1s linear infinite; }
.plate[data-status="review"] .ring { border-color: var(--ng); } .plate[data-status="done"] .ring { border-color: var(--ok); }
.plate[data-status="stopped"] .ring { border-color: var(--ng); animation: blink .7s steps(2) infinite; }
@keyframes spin { to { transform: rotate(360deg); } } @keyframes unspin { to { transform: rotate(-360deg); } } @keyframes blink { 50% { opacity: .15; } }
.bubble { position: absolute; left: 0; top: 0; height: 24px; padding: 0 10px; display: flex; align-items: center; gap: 5px; font-size: 13px; line-height: 24px; border-radius: 12px; white-space: nowrap; overflow: hidden; background: var(--ink); color: #fff; }
.bubble.memo { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); font-weight: 700; padding-left: 3px; }
.bubble.memo.inq { border-color: var(--guest); color: var(--guest); padding-left: 10px; } .bubble.memo.ng { border-color: var(--ng); color: var(--ng); padding-left: 10px; }
.bubble.chat { background: #fff8dc; color: #5a4a12; border: 1px solid #ead9a0; }
.heart { position: absolute; color: #ff5b8a; font-size: 22px; } .heart.up { animation: up 1.5s ease-out forwards; }
@keyframes up { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-46px); opacity: 0; } }

/* 欄の共通 */
#boss, #side section, #top { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
header b { font-size: 14px; } header small { font-size: 11px; color: var(--sub); }
.list { overflow-y: auto; flex: 1; min-height: 0; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; }
.list:empty::after { content: attr(data-empty); color: var(--sub); font-size: 12px; padding: 6px 2px; }
.warn { color: var(--ng); font-size: 12px; } .warn:empty { display: none; }
.ghost { font-size: 12px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
.ok, .ng, .send, .retry { color: #fff; font-weight: 700; font-size: 13px; padding: 5px 14px; border-radius: 14px; background: var(--ok); }
.ng, .retry { background: var(--ng); } .ngline { color: var(--ng); border-color: #f1b9bc; }

/* 左下：担当者からの指示 */
#boss { position: fixed; left: var(--m); bottom: var(--m); width: var(--left-w); height: var(--left-h); display: flex; flex-direction: column; overflow: hidden; }
#boss.attn { border-color: var(--accent); animation: attn 1.4s ease-in-out infinite; }
@keyframes attn { 50% { outline: 4px solid #e0484f33; } } #boss.attn { outline: 0 solid #e0484f00; }
#boss > header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--line); }
#boss > header b::before { content: ""; display: inline-block; width: 5px; height: 14px; background: var(--accent); border-radius: 3px; margin-right: 7px; vertical-align: -2px; }
.msg { max-width: 92%; padding: 6px 10px; border-radius: 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.boss { align-self: flex-end; background: var(--ink); color: #fff; }
.msg.pm { align-self: flex-start; background: #f3f1ec; display: flex; gap: 6px; align-items: flex-start; }
.msg.pm.q { background: #fff3f3; border: 1px solid #f1b9bc; } .msg.pm.q.open { border-color: var(--accent); }
.msg em { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 8px; padding: 1px 7px; margin-right: 6px; }
.msg.stop { align-self: stretch; max-width: none; background: #fff3f3; border: 1px solid var(--ng); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.card { border: 1.5px solid var(--accent); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.card[data-status="ok"] { border-color: var(--ok); } .card[data-status="rejected"] { border-color: var(--line); opacity: .8; }
.chead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); } .ctitle { font-size: 14px; }
.preview { font-size: 11px; line-height: 1.5; color: #4a4f59; background: #f7f6f2; border-radius: 8px; padding: 6px 8px; max-height: 84px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.issues { font-size: 12px; color: var(--ng); background: #fff3f3; border-radius: 8px; padding: 6px 8px; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; } .rj { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.decided { font-size: 12px; font-weight: 700; color: var(--ok); } .card[data-status="rejected"] .decided { color: var(--sub); } .decided:empty { display: none; }
textarea { width: 100%; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; font-size: 13px; background: #fff; }
textarea:focus { outline: 2px solid #2f7fc155; } textarea::placeholder { color: #9aa0aa; }
.inbox { padding: 7px 10px 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; } .inbox.off { background: #f7f6f2; }
.inrow { display: flex; gap: 6px; align-items: flex-end; } .send { background: var(--accent); flex: none; } .inbox.guest .send { background: var(--guest); }
.infoot { display: flex; justify-content: space-between; align-items: center; min-height: 20px; } .count { font-size: 11px; color: var(--sub); margin-left: auto; }
.chip { font-size: 11px; color: var(--blue); border: 1px dashed #9cc4e6; border-radius: 10px; padding: 1px 9px; }
.busy { font-size: 12px; color: var(--blue); font-weight: 700; display: flex; gap: 4px; align-items: center; }
.dots::after { content: "…"; animation: blink 1s steps(2) infinite; }

/* 右の列 */
#side { position: fixed; right: var(--m); top: var(--m); bottom: var(--m); width: var(--right-w); display: flex; flex-direction: column; gap: 10px; }
#side section { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
#side section > header { padding: 7px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
#side .notices { flex: 0 0 22%; } #side .deliveries { flex: 1; } #side .window { flex: 0 0 40%; border-color: #a9dcd4; }
#side .window > header { background: var(--guest); } #side .window > header b, #side .window > header small { color: #fff; }
#side .window.closed { filter: grayscale(.85); opacity: .7; }
.notice { font-size: 12px; display: flex; gap: 7px; } .notice time { color: var(--sub); font-size: 11px; flex: none; padding-top: 1px; }
.notice.n-ng span { color: var(--ng); } .notice.n-ok span { color: var(--ok); font-weight: 700; } .notice.n-inq span { color: var(--guest); } .notice.n-review span { font-weight: 700; }
.delivery { display: flex; align-items: center; gap: 7px; text-align: left; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; font-weight: 700; background: #fbfaf7; }
.delivery small { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--sub); flex: none; }
.wmsg { max-width: 90%; padding: 6px 10px; border-radius: 12px; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; display: flex; flex-direction: column; }
.wmsg.guest { align-self: flex-end; background: var(--guest); color: #fff; } .wmsg.org { align-self: flex-start; background: #eef7f5; }
.wmsg small { font-size: 11px; color: var(--sub); } .wmsg.wait { color: var(--sub); font-style: italic; } .wmsg.withheld { background: #fff3f3; color: var(--ng); }
.inlabel { font-size: 11px; font-weight: 700; color: var(--guest); padding: 5px 12px 0; border-top: 1px solid var(--line); } .inlabel + .inbox { border-top: 0; padding-top: 3px; }

/* 上の見出し */
#top { position: fixed; top: var(--m); left: calc((100vw - var(--right-w)) / 2); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 7px 14px; white-space: nowrap; max-width: calc(100vw - var(--right-w) - 40px); }
.logo { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; flex: none; }
.oname { display: flex; flex-direction: column; line-height: 1.25; } .oname b { font-size: 14px; } .oname small { font-size: 11px; color: var(--sub); }
.usage, .counts { display: flex; gap: 10px; align-items: flex-end; padding-left: 12px; border-left: 1px solid var(--line); position: relative; }
.stat { display: flex; flex-direction: column; line-height: 1.2; align-items: center; } .stat small { font-size: 11px; color: var(--sub); } .stat b { font-size: 14px; font-variant-numeric: tabular-nums; }
.unote { display: none; }
#toasts { position: fixed; top: 78px; left: calc((100vw - var(--right-w)) / 2); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--ink); color: #fff; font-size: 13px; padding: 5px 14px; border-radius: 14px; } .toast.inq { background: var(--guest); }
#note { position: fixed; left: calc(var(--m) + var(--left-w) + 12px); bottom: var(--m); font-size: 11px; color: var(--sub); display: flex; gap: 8px; align-items: center; max-width: calc(100vw - var(--left-w) - var(--right-w) - 220px); }
.badge { font-weight: 800; color: #fff; background: var(--sub); border-radius: 9px; padding: 1px 9px; flex: none; } .badge[data-mode="real"] { background: var(--accent); }
#cam { position: fixed; bottom: var(--m); right: calc(var(--m) + var(--right-w) + 14px); font-size: 12px; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
#conn { position: fixed; top: 0; left: 0; right: 0; text-align: center; background: var(--ng); color: #fff; font-size: 13px; padding: 4px; z-index: 9; }
@media (prefers-reduced-motion: reduce) { #boss.attn { animation: none; } .plate .ring, .plate .icon { animation: none !important; } }

/* スマホの幅：3Dを上に、欄を下に。欄は1つずつ切りかえる */
#tabs { display: none; }
@media (max-width: 820px) {
  :root { --m: 8px; --stage-h: 38%; }
  #stage { bottom: auto; height: var(--stage-h); }
  #top { left: 50%; top: calc(6px + env(safe-area-inset-top, 0px)); padding: 4px 12px; gap: 8px; max-width: calc(100% - 16px); }
  #top .usage, #top .counts { display: none; } .logo { width: 26px; height: 26px; font-size: 14px; } .oname small { display: none; }
  #toasts { top: calc(48px + env(safe-area-inset-top, 0px)); left: 50%; width: calc(100% - 24px); }
  #tabs { display: flex; position: fixed; top: calc(var(--stage-h) + 4px); height: 36px; gap: 6px; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
  #tabs button { flex: 1; font-size: 13px; font-weight: 700; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); position: relative; }
  #tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  #tabs button.dot::after { content: ""; position: absolute; top: 5px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  #boss, #side { top: calc(var(--stage-h) + 46px); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); width: auto; height: auto; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); }
  body[data-tab="boss"] #side, body[data-tab="feed"] #boss, body[data-tab="window"] #boss { display: none; }
  body[data-tab="feed"] #side .window, body[data-tab="window"] #side .notices, body[data-tab="window"] #side .deliveries { display: none; }
  #side .notices { flex: 0 0 48%; } #side .window { flex: 1; }
  #note { left: 10px; right: 10px; bottom: calc(5px + env(safe-area-inset-bottom, 0px)); max-width: none; white-space: nowrap; overflow: hidden; }
  #cam { display: none; }
  textarea { font-size: 16px; } /* iPhone が、入力の時に画面を拡大しないように */
  .ok, .ng, .send, .retry { padding: 8px 16px; } .ghost { padding: 7px 12px; } .chip { padding: 5px 11px; font-size: 12px; }
  #labels.compact .plate { height: 42px; padding: 0; flex-direction: column; justify-content: center; gap: 1px; background: none; border: 0; }
  #labels.compact .plate small { display: none; } #labels.compact .plate b { font-size: 11px; line-height: 1.25; background: var(--paper); border-radius: 6px; padding: 0 4px; }
  #labels.compact .bubble { font-size: 12px; }
}

/* 公開用の追加：1画面のアプリとして収める／「中身を見る」を画面の上に重ねる */
html, body { height: 100%; }
:root { color-scheme: light; }
.viewer { position: fixed; inset: 0; z-index: 20; background: #22262e99; display: flex; align-items: center; justify-content: center; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.vbox { background: var(--paper); color: var(--ink); border-radius: var(--r); width: min(820px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.vbox > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.vbox > header b { font-size: 15px; min-width: 0; } .vbox > header .ghost { margin-left: auto; flex: none; }
.vtag { color: #fff; background: var(--ng); font-size: 12px; font-weight: 800; border-radius: 10px; padding: 1px 10px; flex: none; } .vtag.ok { background: var(--ok); }
.vbox > footer { font-size: 11px; color: var(--sub); padding: 8px 14px; border-top: 1px solid var(--line); }
.doc { overflow-y: auto; padding: 14px 20px 20px; font-size: 14px; line-height: 1.8; min-height: 0; }
.doc h1 { font-size: 19px; line-height: 1.4; margin: 6px 0 10px; text-wrap: balance; } .doc h2 { font-size: 15px; margin: 18px 0 4px; padding-left: 8px; border-left: 5px solid var(--accent); } .doc h3 { font-size: 14px; margin: 12px 0 2px; }
.doc p { margin: 5px 0; } .doc ul, .doc ol { margin: 5px 0; padding-left: 22px; } .doc hr { border: 0; border-top: 1px dashed var(--line); margin: 20px 0; }
.tablewrap { overflow-x: auto; } .doc table { border-collapse: collapse; font-size: 13px; margin: 6px 0; min-width: 100%; }
.doc th, .doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; white-space: nowrap; } .doc th { background: #f5f4ef; }
.doc mark { background: #fff3b0; color: var(--ink); border-radius: 4px; padding: 0 3px; font-weight: 700; }
</style>
</head>
<body>
<main id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="no3d" hidden>3Dを表示できません（左下の欄と右の一覧は、そのまま使えます）</div>
</main>
<header id="top"></header>
<div id="toasts"></div>
<nav id="tabs"></nav>
<aside id="boss"></aside>
<aside id="side"></aside>
<div id="note"></div>
<button id="cam" type="button" hidden></button>
<div id="conn" hidden>サーバーにつながっていません。つなぎ直しています…</div>
<script type="module" src="main.js"></script>
</body>
</html>
